[package]
name = "xraybox"
version = "0.1.0"
description = "VLESS Reality client"
authors = ["xraybox"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xraybox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
ureq = "2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "url", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Published swift-rs 1.0.7 passes the iOS SDK through -Xswiftc. Xcode 27 then
# appends the macOS SDK, so the Tauri Swift package is compiled against AppKit.
# Master builds iOS with --triple instead.
[patch.crates-io]
swift-rs = { git = "https://github.com/Brendonovich/swift-rs", branch = "main" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

