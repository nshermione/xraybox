<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>xraybox</title>
    <script>
      console.log("[xraybox-boot] html inline href=" + location.href);
      (() => {
        try {
          const pref = localStorage.getItem("xraybox.theme");
          const dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* theme applies again after JS boots */
        }
        try {
          // sessionStorage outlives a webview reload but not an app relaunch,
          // so a reload skips the splash before it ever paints.
          if (sessionStorage.getItem("xraybox.splashSeen") === "1") {
            document.documentElement.dataset.boot = "warm";
          }
        } catch {
          /* the Rust side decides again once JS boots */
        }
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #151024;
        overflow: hidden;
      }

      #app.app-boot {
        height: 100%;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
      }

      #app.is-revealed {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
        transition:
          opacity 560ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 560ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      html[data-boot="warm"] .boot-splash {
        display: none;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #151024;
        user-select: none;
        -webkit-user-select: none;
      }

      .boot-splash::before {
        content: "";
        position: absolute;
        width: min(72vw, 320px);
        height: min(72vw, 320px);
        border-radius: 50%;
        background: radial-gradient(circle, rgb(167 139 250 / 22%) 0%, transparent 68%);
        pointer-events: none;
      }

      .boot-mark {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: clamp(32px, 8.2vw, 48px);
        font-weight: 600;
        letter-spacing: 0;
        line-height: 1;
        color: #f5f3ff;
        -webkit-font-smoothing: antialiased;
      }

      .boot-c {
        position: relative;
        display: grid;
        place-items: center;
        width: 1.85em;
        height: 1.85em;
        flex: 0 0 auto;
        transition:
          width 760ms cubic-bezier(0.22, 1, 0.36, 1),
          height 760ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .boot-icon {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        transition:
          opacity 380ms ease 40ms,
          transform 760ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .boot-spinner {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-spin 1.05s linear infinite;
        will-change: transform;
      }

      .boot-letter-c {
        display: grid;
        place-items: center;
        color: #c4b5fd;
        letter-spacing: -0.045em;
        opacity: 0;
        transform: scale(0.72);
        transition:
          opacity 320ms ease 160ms,
          transform 520ms cubic-bezier(0.22, 1, 0.36, 1) 120ms;
      }

      .boot-rest-clip {
        display: grid;
        grid-template-columns: 0fr;
        opacity: 0;
        transition:
          grid-template-columns 800ms cubic-bezier(0.22, 1, 0.36, 1) 60ms,
          opacity 360ms ease 100ms;
      }

      .boot-rest {
        display: flex;
        align-items: center;
        min-width: 0;
        overflow: hidden;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      .boot-rest .ch {
        display: inline-block;
        flex-shrink: 0;
        opacity: 0;
        transform: translateX(-0.22em);
        filter: blur(6px);
      }

      .boot-rest .ch:nth-child(1) { --i: 0; }
      .boot-rest .ch:nth-child(2) { --i: 1; }
      .boot-rest .ch:nth-child(3) { --i: 2; }
      .boot-rest .ch:nth-child(4) { --i: 3; }
      .boot-rest .ch:nth-child(5) { --i: 4; }
      .boot-rest .ch:nth-child(6) { --i: 5; }

      .boot-rest .ch-o {
        color: #e9d5ff;
      }

      .boot-splash[data-phase="word"] .boot-c,
      .boot-splash[data-phase="leave"] .boot-c {
        width: 0.72em;
        height: 1em;
      }

      .boot-splash[data-phase="word"] .boot-icon,
      .boot-splash[data-phase="leave"] .boot-icon {
        opacity: 0;
        transform: scale(0.78);
      }

      .boot-splash[data-phase="word"] .boot-letter-c,
      .boot-splash[data-phase="leave"] .boot-letter-c {
        opacity: 1;
        transform: scale(1);
      }

      .boot-splash[data-phase="word"] .boot-rest-clip,
      .boot-splash[data-phase="leave"] .boot-rest-clip {
        grid-template-columns: 1fr;
        opacity: 1;
      }

      .boot-splash[data-phase="word"] .boot-rest .ch,
      .boot-splash[data-phase="leave"] .boot-rest .ch {
        animation: boot-letter-in 560ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(140ms + var(--i) * 68ms);
      }

      .boot-splash[data-phase="word"] .boot-rest .ch-o,
      .boot-splash[data-phase="leave"] .boot-rest .ch-o {
        animation-name: boot-o-in;
      }

      .boot-splash[data-phase="leave"] {
        opacity: 0;
        transition: opacity 520ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .boot-splash[data-phase="leave"] .boot-mark {
        transform: scale(0.97);
        filter: blur(6px);
        transition:
          transform 520ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 520ms ease;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-letter-in {
        from {
          opacity: 0;
          transform: translateX(-0.22em);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          filter: blur(0);
        }
      }

      @keyframes boot-o-in {
        from {
          opacity: 0;
          transform: scale(0.28);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
          transform: rotate(225deg);
        }

        #app.app-boot,
        #app.is-revealed,
        .boot-c,
        .boot-icon,
        .boot-letter-c,
        .boot-rest-clip,
        .boot-splash[data-phase="leave"],
        .boot-splash[data-phase="leave"] .boot-mark {
          transition: none;
        }

        .boot-splash[data-phase="word"] .boot-rest .ch,
        .boot-splash[data-phase="leave"] .boot-rest .ch {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
    </style>
  </head>

  <body>
    <div
      id="boot-splash"
      class="boot-splash"
      data-phase="spin"
      role="status"
      aria-live="polite"
      aria-label="Loading xraybox"
    >
      <div class="boot-mark">
        <span class="boot-c">
          <svg class="boot-icon" viewBox="0 0 32 32" aria-hidden="true">
            <g class="boot-spinner">
              <path
                d="M8 16c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8"
                fill="none"
                stroke="#A78BFA"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </g>
            <circle class="boot-dot" cx="16" cy="16" r="2.5" fill="#D8B4FE" />
          </svg>
          <span class="boot-letter-c">x</span>
        </span>
        <span class="boot-rest-clip" aria-hidden="true">
          <span class="boot-rest">
            <span class="ch">r</span>
            <span class="ch">a</span>
            <span class="ch">y</span>
            <span class="ch">b</span>
            <span class="ch ch-o">o</span>
            <span class="ch">x</span>
          </span>
        </span>
      </div>
    </div>
    <div id="app" class="app-boot"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
